spring:
  application:
    name: chupke-se-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/chupke_se
    username: chupke_app
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  cors:
    allowed-origin: http://localhost:5173